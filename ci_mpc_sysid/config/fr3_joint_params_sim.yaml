# FR3 joint parameters applied to the Isaac scene by scripts/isaac/prepare_scene.py and used as ground
# truth when validating the identification in sim. Fitted parameters (fit_joint_id.py) use this format.
# Units: friction [Nm], viscous [Nm s/rad], armature [kg m^2]. friction: |tau| = coulomb + viscous*|dq|
# while moving, static = breakaway torque. offset = direction-independent bias (not representable in PhysX).
source: >-
  friction: upstream identification (cartesian_impedance_controller.hpp static_friction, coulomb_friction,
  beta); armature: franka_description dynamics.yaml motor_inertia * gear_ratio^2
