# Stage-1 MPC on the real FR3: NOT TESTED YET. Conservative limits for the first runs; widen after the
# identification (docs/SYSID.md) and after checking the behaviour at these limits.
ci_mpc_planner:
  ros__parameters:
    use_sim_time: false
    urdf_path: /home/njohnson/ci_mpc_assets/fr3.urdf
    ee_frame: fr3_hand_tcp
    # the controller (model_source franka) tracks the Desk profile's TCP, 8.5 mm beyond fr3_hand_tcp: plan in that frame
    ee_profile: /home/njohnson/franka_ros2_ws/src/ci_mpc/scripts/real/desk_ee_hand_camera_mount_v0.1.endeffector-profile.json
    task: hold
    solve_rate: 50.0
    cmd_rate: 200.0
    dt: 0.02
    horizon: 50
    q_pos: 1000.0
    q_vel: 50.0
    r_acc: 1.0
    r_dacc: 0.1
    terminal: 10.0
    v_max: 0.1
    a_max: 0.5
    p_min: [0.25, -0.25, 0.2]   # small box around the libfranka home pose (0.307, 0, 0.487)
    p_max: [0.55, 0.25, 0.6]
    w_max: 0.3
    alpha_max: 1.0
    rot_box: 0.5
    replan_from: plan
    reset_threshold: 0.02
    rot_reset_threshold: 0.05
    integral_enabled: true
    force_limit: 12.0           # [N] acceleration limit = force_limit / Lambda (controller clamp 18 N)
    torque_limit: [6.0, 6.0, 1.5]  # [Nm] (controller clamps 9 / 9 / 2 Nm)
    sigma_min_stop: 0.1
    stiffness: [2500.0, 2500.0, 1000.0, 130.0, 130.0, 45.0]  # controller default; rot. 260/260/90 buzzed at home (2026-10-27)
    armature: [0.0]             # unknown on our robot until identified (MuJoCo Menagerie: 0.195 / 0.074)
